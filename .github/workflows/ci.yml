name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check README
        run: |
          test -f README.md
          grep -q "Healthcheck" README.md

      - name: Check Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine \
            nginx -t

      - name: Build Docker image
        run: |
          docker build -t devops-git-lab:test .

      - name: Success
        run: echo "All CI checks passed"
